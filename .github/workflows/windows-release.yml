# Builds the unsigned Microsoft Store package (x64 and ARM64, bundled) and uploads it as a workflow artifact. It does not submit it:
# there is no Partner Center credential in this workflow and no step that talks to Partner Center. The owner takes the artifact to Partner Center
# (phase 9 adds the submit step in its own change). Both build jobs run in the `release` environment, which holds the OAuth client ids and needs the
# owner's approval, so nothing builds (and no id is readable) until the owner approves the run.
#
# It runs when a release is published (a plain vX.Y.Z tag builds the stable package; a suffixed tag such as v1.2.0-beta.1 builds a flight package),
# or by hand with a version. Same ref rules as the Mac App Store workflow: only the default branch or a version tag, and a manual run without a ref
# needs the tag to exist. The pull-request check of the same path is windows-release-dryrun.yml (fake ids, a throwaway certificate, no secret).
name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version X.Y.Z, or X.Y.Z-suffix for a flight, without the leading v (for example 1.2.0)
        required: true
        type: string
      ref:
        description: Only the default branch or a version tag; blank builds the existing tag v<version>
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.resolve.outputs.go }}
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      flight: ${{ steps.resolve.outputs.flight }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Decide what to build
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $exists = $false
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_VERSION) {
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$($env:INPUT_VERSION)" *> $null
            $exists = ($LASTEXITCODE -eq 0)
          }
          ./scripts/release/resolve-release.ps1 -EventName $env:EVENT_NAME -ReleaseTag $env:RELEASE_TAG -ReleasePrerelease ($env:RELEASE_PRERELEASE -eq 'true') `
            -InputVersion $env:INPUT_VERSION -InputRef $env:INPUT_REF -DefaultBranch $env:DEFAULT_BRANCH -TagExists $exists
      - name: Only build commits that were merged, and pin the build to that commit
        id: pin
        if: steps.resolve.outputs.go == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ steps.resolve.outputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./scripts/release/assert-on-default-branch.ps1 -Ref $env:BUILD_REF -DefaultBranch $env:DEFAULT_BRANCH

  build:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: windows-latest, platform: x64 }
          - { runner: windows-11-arm, platform: ARM64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the Store package (${{ matrix.platform }})
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FLIGHT: ${{ needs.plan.outputs.flight }}
          PARTNER_CENTER_PACKAGE_NAME: ${{ vars.PARTNER_CENTER_PACKAGE_NAME }}
          PARTNER_CENTER_PUBLISHER: ${{ vars.PARTNER_CENTER_PUBLISHER }}
          PARTNER_CENTER_PUBLISHER_DISPLAY_NAME: ${{ vars.PARTNER_CENTER_PUBLISHER_DISPLAY_NAME }}
          PARTNER_CENTER_APP_NAME: ${{ vars.PARTNER_CENTER_APP_NAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: ./scripts/release/build-release-msix.ps1 -Flavour Store -Platform ${{ matrix.platform }} -Version $env:VERSION -Prerelease:($env:FLIGHT -eq 'true') -RequireOAuthIds -OutputFolder build/release
      - name: Upload the unsigned package (${{ matrix.platform }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-package-${{ matrix.platform }}
          path: |
            build/release/*.msix
            build/release/*.msixupload
            build/release/build-info.txt
          if-no-files-found: error
          retention-days: 30

  bundle:
    needs: [plan, build]
    name: bundle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: store-package-*
          path: build/packages
      - name: Make the two-architecture upload
        shell: pwsh
        run: ./scripts/release/bundle-msixupload.ps1 -Folder build/packages -OutputFolder build/upload
      - name: Upload the Partner Center file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-upload
          path: |
            build/upload/*.msixupload
          if-no-files-found: error
          retention-days: 30
