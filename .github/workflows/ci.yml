# Required checks (set by the owner): windows-x64, windows-arm64, architecture.
# All logic lives in scripts/; this file only selects runners and calls them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and test (x64)
        shell: pwsh
        run: ./scripts/verify.ps1 -Platform x64 -Configuration CI
      - name: Build and install the development MSIX (x64)
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/ci/build-msix.ps1 -Platform x64
      - name: Self-test (x64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -TimeoutSeconds 90
      - name: Self-test welcome window (x64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -Scenario welcome -OutputFolder build/selftest-welcome -TimeoutSeconds 120
      - name: Self-test tug window (x64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -Scenario tug-basic -OutputFolder build/selftest-tug-basic -TimeoutSeconds 150
      - name: Self-test startup through the real composition root and engine (x64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -Scenario startup -OutputFolder build/selftest-startup -TimeoutSeconds 150
      - name: Self-test tray menu model and icons (x64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -Scenario tray -OutputFolder build/selftest-tray -TimeoutSeconds 120
      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-x64
          path: |
            build/selftest/
            build/selftest-welcome/
            build/selftest-tug-basic/
            build/selftest-startup/
            build/selftest-tray/
          if-no-files-found: warn
          retention-days: 14

  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and test (ARM64)
        shell: pwsh
        run: ./scripts/verify.ps1 -Platform ARM64 -Configuration CI
      - name: Build and install the development MSIX (ARM64)
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/ci/build-msix.ps1 -Platform ARM64
      - name: Self-test (ARM64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -TimeoutSeconds 90
      - name: Self-test welcome window (ARM64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -Scenario welcome -OutputFolder build/selftest-welcome -TimeoutSeconds 120
      - name: Self-test tug window (ARM64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -Scenario tug-basic -OutputFolder build/selftest-tug-basic -TimeoutSeconds 150
      - name: Self-test startup through the real composition root and engine (ARM64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -Scenario startup -OutputFolder build/selftest-startup -TimeoutSeconds 150
      - name: Self-test tray menu model and icons (ARM64)
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/ci/run-selftest.ps1 -Scenario tray -OutputFolder build/selftest-tray -TimeoutSeconds 120
      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-arm64
          path: |
            build/selftest/
            build/selftest-welcome/
            build/selftest-tug-basic/
            build/selftest-startup/
            build/selftest-tray/
          if-no-files-found: warn
          retention-days: 14

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Architecture rules and repository contracts
        run: scripts/ci/architecture.sh
